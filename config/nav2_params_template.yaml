# Nav2 parameters — TEMPLATE for multi-robot deployment.
#
# Frame IDs are PLAIN (base_link, odom, map) — no namespace prefix.
# Each robot runs under its own ROS2 namespace, and nav2_bringup's internal
# remapping pushes /tf → /<ns>/tf so plain frame names don't collide.
#
# This file is used via RewrittenYaml in launch — no per-robot copies needed.
#
# Global planner: placeholder NavFn with use_astar=true. Will be replaced
# by the custom A* + spline plugin (amr_fleet_core.planners.global_planner_node)
# once it's validated.
#
# DWB max speed: 0.9 m/s — believable warehouse AMR speed for demo recording.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    laser_model_type: "likelihood_field"
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0
    # Initial pose is NOT set here — it's published per-robot by
    # initial_pose_publisher.py with each robot's known spawn pose.
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""   # supplied via launch arg

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: true
      allow_unknown: true
      tolerance: 0.5

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.9
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.9
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_theta: 2.5
      decel_lim_x: -1.5
      decel_lim_theta: -2.5
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 2.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "odom"
      robot_base_frame: "base_footprint"
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.28
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: "map"
      robot_base_frame: "base_footprint"
      width: 21
      height: 15
      origin_x: -10.5
      origin_y: -7.5
      resolution: 0.05
      robot_radius: 0.28
      track_unknown_space: true
      always_send_full_costmap: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_footprint"
    transform_tolerance: 0.5
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: odom
    transform_tolerance: 0.5
    default_bt_xml_filename: ""
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    attempt_respawn: true
    bond_timeout: 10.0
    node_names:
      ["map_server", "amcl", "controller_server", "planner_server",
       "behavior_server", "bt_navigator", "waypoint_follower"]
